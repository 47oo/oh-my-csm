services:
  postgres:
    image: postgres:16-alpine
    container_name: oh-my-csm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oh_my_csm}
      POSTGRES_USER: ${POSTGRES_USER:-csm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csm_change_me_in_prod}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csm} -d ${POSTGRES_DB:-oh_my_csm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: oh-my-csm-backend:latest
    container_name: oh-my-csm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Oh-My-CSM}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-csm}:${POSTGRES_PASSWORD:-csm_change_me_in_prod}@postgres:5432/${POSTGRES_DB:-oh_my_csm}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      CSM_SECRET_KEYS: ${CSM_SECRET_KEYS:?CSM_SECRET_KEYS is required}
      CSM_ACTIVE_KEY_VERSION: ${CSM_ACTIVE_KEY_VERSION:-1}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin123456}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}

  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: oh-my-csm-frontend:latest
    container_name: oh-my-csm-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pg_data:
